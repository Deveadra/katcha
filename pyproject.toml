[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "katcha"
version = "0.1.0"
description = "Automation-first media intelligence and production engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "temporalio>=1.9,<2",
  "boto3>=1.35,<2",
  "yt-dlp>=2026.8.1",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.18,<1",
  "cryptography>=45,<47",
]

[project.optional-dependencies]
ai = [
  "openai>=1.100,<2",
  "google-genai>=1.30,<2",
]
media = [
  "faster-whisper>=1.1,<2",
  "imagehash>=4.3,<5",
  "Pillow>=11,<12",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Query"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
strict = true

[tool.setuptools.package-data]
katcha = [
  "web/*.html",
  "web/*.css",
  "web/*.js",
  "assets/**/*.png",
]
