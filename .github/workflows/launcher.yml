name: Application launcher
on:
  pull_request:
    paths:
      - .github/workflows/launcher.yml
      - launcher/**
      - Katcha.sh
      - Katcha.ps1
      - Katcha.cmd
      - web-tests/launcher.cjs
      - web-tests/package.json
      - web-tests/package-lock.json
      - src/katcha/web/**
      - docker-compose*.yml
      - .env.example
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launcher-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  launcher:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install pytest pytest-asyncio ruff
      - run: ruff check launcher
      - run: python -m pytest launcher/tests -q
      - name: Validate complete application service model
        run: |
          KATCHA_ENV_FILE=.env.example docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.discovery.yml -f docker-compose.trends.yml -f docker-compose.intelligence.yml -f docker-compose.app.yml config --quiet
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-tests/package-lock.json
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: launcher-playwright-${{ runner.os }}-${{ hashFiles('web-tests/package-lock.json') }}
      - run: npm ci --ignore-scripts
        working-directory: web-tests
      - run: npx playwright install --with-deps chromium
        working-directory: web-tests
      - run: node launcher.cjs
        working-directory: web-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launcher-preview
          path: web-tests/test-results/launcher*.png
          if-no-files-found: ignore
  full-startup:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Boot full application and verify GUI, API and safe stop
        run: python launcher/tests/acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launcher-startup-diagnostics
          path: .local/runtime/events.jsonl*
          include-hidden-files: true
          if-no-files-found: ignore
