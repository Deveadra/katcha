name: OCI A1 bootstrap capacity

on:
  pull_request:
    paths:
      - .github/workflows/oci-bootstrap-capacity.yml
      - src/katcha/ops/oci_bootstrap_capacity.py
      - tests/test_oci_bootstrap_capacity.py
      - scripts/configure-github-oci-bootstrap.sh
      - scripts/bootstrap-acquired-oci-host.sh
      - deploy/scripts/bootstrap-initial-primary.sh
      - scripts/configure-github-recovery-notifications.sh
      - scripts/transition-oci-bootstrap.sh
      - scripts/notify-telegram.sh
      - scripts/report-bootstrap-heartbeat.sh
  repository_dispatch:
    types: [katcha-bootstrap-poll]
  workflow_dispatch:
    inputs:
      mode:
        description: Run one operator validation pass or an autonomous polling pass
        required: true
        default: validate
        type: choice
        options:
          - validate
          - poll
  schedule:
    # Dead-man/backstop only. Active searches self-dispatch the next serialized
    # pass immediately after a capacity miss, avoiding reliance on cron latency.
    - cron: "1,6,11,16,21,26,31,36,41,46,51,56 * * * *"

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate bootstrap poller
        run: |
          python -m pip install -e '.[dev]'
          python -m py_compile src/katcha/ops/oci_bootstrap_capacity.py
          bash -n scripts/configure-github-oci-bootstrap.sh
          bash -n scripts/bootstrap-acquired-oci-host.sh
          bash -n deploy/scripts/bootstrap-initial-primary.sh
          bash -n scripts/configure-github-recovery-notifications.sh
          bash -n scripts/transition-oci-bootstrap.sh
          bash -n scripts/notify-telegram.sh
          bash -n scripts/report-bootstrap-heartbeat.sh
          pytest -q tests/test_oci_bootstrap_capacity.py

  poll:
    if: >-
      (
        (
          github.event_name == 'workflow_dispatch' &&
          (
            inputs.mode == 'validate' ||
            (
              inputs.mode == 'poll' &&
              vars.KATCHA_OCI_BOOTSTRAP_POLL_ENABLED == 'true'
            )
          )
        ) ||
        (
          github.event_name == 'repository_dispatch' &&
          github.event.action == 'katcha-bootstrap-poll' &&
          vars.KATCHA_OCI_BOOTSTRAP_POLL_ENABLED == 'true'
        ) ||
        (
          github.event_name == 'schedule' &&
          vars.KATCHA_OCI_BOOTSTRAP_POLL_ENABLED == 'true'
        )
      ) &&
      vars.KATCHA_OCI_RECOVERY_CONFIGURED != 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: katcha-oci-bootstrap-capacity
      cancel-in-progress: false
    timeout-minutes: 35
    env:
      KATCHA_OCI_COMPARTMENT_ID: ${{ vars.KATCHA_OCI_COMPARTMENT_ID }}
      KATCHA_OCI_AVAILABILITY_DOMAIN: ${{ vars.KATCHA_OCI_AVAILABILITY_DOMAIN }}
      KATCHA_OCI_SUBNET_ID: ${{ vars.KATCHA_OCI_SUBNET_ID }}
      KATCHA_OCI_CROSS_AD_TARGETS_JSON: ${{ vars.KATCHA_OCI_CROSS_AD_TARGETS_JSON }}
      KATCHA_OCI_PRIMARY_IMAGE_ID: ${{ vars.KATCHA_OCI_PRIMARY_IMAGE_ID }}
      KATCHA_OCI_PRIMARY_SHAPE: ${{ vars.KATCHA_OCI_PRIMARY_SHAPE }}
      KATCHA_OCI_PRIMARY_OCPUS: ${{ vars.KATCHA_OCI_PRIMARY_OCPUS }}
      KATCHA_OCI_PRIMARY_MEMORY_GB: ${{ vars.KATCHA_OCI_PRIMARY_MEMORY_GB }}
      KATCHA_OCI_ASSIGN_PUBLIC_IP: ${{ vars.KATCHA_OCI_ASSIGN_PUBLIC_IP }}
      KATCHA_OCI_DATA_VOLUME_ID: ${{ vars.KATCHA_OCI_DATA_VOLUME_ID }}
      KATCHA_OCI_CROSS_AD_DATA_VOLUME_SIZE_GB: ${{ vars.KATCHA_OCI_CROSS_AD_DATA_VOLUME_SIZE_GB }}
      KATCHA_OCI_DATA_VOLUME_DEVICE_PATH: ${{ vars.KATCHA_OCI_DATA_VOLUME_DEVICE_PATH }}
      KATCHA_OCI_SSH_PUBLIC_KEY: ${{ vars.KATCHA_OCI_SSH_PUBLIC_KEY }}
      KATCHA_RECOVERY_COORDINATOR_URL: ${{ vars.KATCHA_RECOVERY_COORDINATOR_URL }}
      KATCHA_RECOVERY_CANDIDATE_TOKEN: ${{ secrets.KATCHA_RECOVERY_CANDIDATE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record bootstrap run start
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/report-bootstrap-heartbeat.sh started false

      - name: Notify operator when Cloudflare revives polling
        if: github.event_name == 'repository_dispatch'
        shell: bash
        env:
          KATCHA_TELEGRAM_BOT_TOKEN: ${{ secrets.KATCHA_TELEGRAM_BOT_TOKEN }}
          KATCHA_TELEGRAM_CHAT_ID: ${{ secrets.KATCHA_TELEGRAM_CHAT_ID }}
          KATCHA_TELEGRAM_THREAD_ID: ${{ vars.KATCHA_TELEGRAM_THREAD_ID }}
          KATCHA_TELEGRAM_REQUIRED: "false"
        run: |
          set -euo pipefail
          bash scripts/notify-telegram.sh \
            "Katcha polling recovery: Cloudflare restarted OCI A1 polling after the GitHub bootstrap heartbeat went stale."

      - name: Install isolated OCI CLI
        run: |
          set -euo pipefail
          python -m venv /tmp/katcha-oci-cli
          /tmp/katcha-oci-cli/bin/python -m pip install --upgrade pip
          /tmp/katcha-oci-cli/bin/python -m pip install 'oci-cli==3.94.1'
          echo "/tmp/katcha-oci-cli/bin" >> "$GITHUB_PATH"

      - name: Configure OCI API authentication
        shell: bash
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_API_PRIVATE_KEY: ${{ secrets.OCI_API_PRIVATE_KEY }}
          OCI_REGION: ${{ vars.OCI_REGION }}
        run: |
          set -euo pipefail

          require() {
            local name="$1"
            local value="$2"
            if [[ -z "$value" ]]; then
              echo "Missing required bootstrap credential/config: $name" >&2
              exit 41
            fi
          }

          require OCI_TENANCY_OCID "$OCI_TENANCY_OCID"
          require OCI_USER_OCID "$OCI_USER_OCID"
          require OCI_FINGERPRINT "$OCI_FINGERPRINT"
          require OCI_API_PRIVATE_KEY "$OCI_API_PRIVATE_KEY"
          require OCI_REGION "$OCI_REGION"

          umask 077
          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_API_PRIVATE_KEY" > "$HOME/.oci/oci_api_key.pem"
          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          key_file=$HOME/.oci/oci_api_key.pem
          EOF

          oci compute instance list \
            --compartment-id "$KATCHA_OCI_COMPARTMENT_ID" \
            --limit 1 \
            --query 'length(data)' \
            --raw-output >/dev/null

      - name: Poll all configured A1 availability domains
        id: bootstrap
        shell: bash
        run: |
          set -euo pipefail

          result="$(PYTHONPATH=src python -m katcha.ops.oci_bootstrap_capacity)"
          echo "$result" | jq .

          status="$(echo "$result" | jq -er '.status')"
          echo "status=$status" >> "$GITHUB_OUTPUT"

          if [[ "$status" == "acquired" ]]; then
            echo "instance_id=$(echo "$result" | jq -er '.instance_id')" >> "$GITHUB_OUTPUT"
            echo "availability_domain=$(echo "$result" | jq -er '.availability_domain')" >> "$GITHUB_OUTPUT"
            echo "subnet_id=$(echo "$result" | jq -er '.subnet_id')" >> "$GITHUB_OUTPUT"
            echo "volume_id=$(echo "$result" | jq -er '.volume_id')" >> "$GITHUB_OUTPUT"
            echo "attachment_id=$(echo "$result" | jq -er '.attachment_id')" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "## OCI A1 bootstrap capacity"
            echo
            echo '```json'
            echo "$result" | jq .
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$status" == "capacity-unavailable" ]]; then
            echo "No 2 OCPU / 12 GB A1 capacity is available yet; the next scheduled run will retry."
            exit 0
          fi

          if [[ "$status" != "acquired" ]]; then
            echo "Unexpected bootstrap status: $status" >&2
            exit 42
          fi

          echo "A1 capacity acquired and durable storage attached."

      - name: Transition acquired capacity
        id: handoff
        if: steps.bootstrap.outputs.status == 'acquired'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.KATCHA_GITHUB_AUTOMATION_TOKEN }}
          KATCHA_BOOTSTRAP_INSTANCE_ID: ${{ steps.bootstrap.outputs.instance_id }}
          KATCHA_BOOTSTRAP_AVAILABILITY_DOMAIN: ${{ steps.bootstrap.outputs.availability_domain }}
          KATCHA_BOOTSTRAP_SUBNET_ID: ${{ steps.bootstrap.outputs.subnet_id }}
          KATCHA_BOOTSTRAP_VOLUME_ID: ${{ steps.bootstrap.outputs.volume_id }}
          KATCHA_BOOTSTRAP_ATTACHMENT_ID: ${{ steps.bootstrap.outputs.attachment_id }}
          KATCHA_TELEGRAM_BOT_TOKEN: ${{ secrets.KATCHA_TELEGRAM_BOT_TOKEN }}
          KATCHA_TELEGRAM_CHAT_ID: ${{ secrets.KATCHA_TELEGRAM_CHAT_ID }}
          KATCHA_TELEGRAM_THREAD_ID: ${{ vars.KATCHA_TELEGRAM_THREAD_ID }}
          KATCHA_TELEGRAM_REQUIRED: "true"
        run: |
          set -euo pipefail
          bash scripts/transition-oci-bootstrap.sh

      - name: Continue autonomous capacity search
        if: >-
          always() &&
          vars.KATCHA_OCI_BOOTSTRAP_POLL_ENABLED == 'true' &&
          (
            steps.bootstrap.outputs.status == 'capacity-unavailable' ||
            (
              steps.bootstrap.outputs.status == 'acquired' &&
              steps.handoff.outcome == 'failure'
            )
          )
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.KATCHA_GITHUB_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "Missing KATCHA_GITHUB_AUTOMATION_TOKEN; cannot continue autonomous polling." >&2
            exit 51
          fi

          echo "Dispatching the next serialized A1 capacity pass immediately."
          gh workflow run oci-bootstrap-capacity.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f mode=poll


      - name: Record bootstrap run completion
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status="run-failed"
          terminal=false

          if [[ "${{ steps.bootstrap.outputs.status }}" == "capacity-unavailable" ]]; then
            status="capacity-unavailable"
          elif [[ "${{ steps.bootstrap.outputs.status }}" == "acquired" && "${{ steps.handoff.outcome }}" == "success" ]]; then
            status="acquired"
            terminal=true
          elif [[ "${{ steps.bootstrap.outputs.status }}" == "acquired" ]]; then
            status="handoff-failed"
          fi

          bash scripts/report-bootstrap-heartbeat.sh "$status" "$terminal"
