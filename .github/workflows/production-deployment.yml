name: Production deployment

on:
  pull_request:
    paths:
      - .github/workflows/production-deployment.yml
      - deploy/scripts/production-deploy.py
      - deploy/scripts/production-deploy-poll.py
      - deploy/scripts/production-deploy-notify.py
      - deploy/systemd/katcha-production-deploy-notify.service
      - deploy/systemd/katcha-production-deploy-notify.timer
      - deploy/scripts/install-production-deployer.sh
      - deploy/systemd/katcha-production-deploy-poll.service
      - deploy/systemd/katcha-production-deploy-poll.timer
      - src/katcha/ops/release_eligibility.py
      - tests/test_production_deploy.py
      - docs/PRODUCTION_DEPLOYMENT_RUNBOOK.md
      - docs/PRODUCTION_MANUAL_DEPLOYMENT_RUNBOOK.md
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact previously CI-published commit on accepted main ancestry (40 lowercase hex)
        required: true
        type: string
      running_workflows:
        description: Policy for ongoing Temporal workflows
        required: true
        default: refuse
        type: choice
        options: [refuse, approved-resume]
      migration_policy:
        description: Migration approval; default is no schema changes
        required: true
        default: refuse
        type: choice
        options: [refuse, approve-additive-0064, approve-additive-through-0065, approve-additive-through-0066]
      confirmation:
        description: Type DEPLOY KATCHA PRODUCTION
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Keep live manual releases serialized; PR-only contract checks must not
  # queue behind a manual request waiting for Environment approval.
  group: ${{ github.event_name == 'workflow_dispatch' && 'katcha-production-deployment' || format('katcha-production-validation-pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test production deployment and signing contracts
        run: |
          python -m pip install pytest
          python -m py_compile deploy/scripts/production-deploy.py deploy/scripts/production-deploy-poll.py deploy/scripts/production-deploy-notify.py
          bash -n deploy/scripts/install-production-deployer.sh
          bash -n scripts/check-production-deployment-github.sh
          # Isolated contract tests need only pytest, not app-wide SQLAlchemy fixtures.
          python -m pytest --noconftest -q tests/test_production_deploy.py tests/test_production_github_auth_preflight.py tests/test_production_deploy_notifications.py

  preflight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TARGET_SHA: ${{ inputs.release_sha }}
      CONFIRMATION: ${{ inputs.confirmation }}
      GATE: ${{ vars.KATCHA_PRODUCTION_DEPLOY_ENABLED }}
    steps:
      - name: Require explicit release and independent deployment authorization
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GATE" != "true" ]]; then
            echo "Production deployment is disabled by dedicated repository variable." >&2
            exit 41
          fi
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$CONFIRMATION" != "DEPLOY KATCHA PRODUCTION" ]]; then
            echo "Exact SHA and explicit production confirmation required." >&2
            exit 42
          fi
          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "Production requests must originate on main." >&2
            exit 43
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify candidate main ancestry, CI and GHCR publication
        shell: bash
        run: |
          PYTHONPATH=src python scripts/check_production_release.py "$TARGET_SHA"

  notify-review:
    # Deliberately outside the protected Environment: this job must run
    # BEFORE the operator approves authorize-request.
    if: github.event_name == 'workflow_dispatch'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Alert the operator only when GitHub requests Environment review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.release_sha }}
          KATCHA_TELEGRAM_BOT_TOKEN: ${{ secrets.KATCHA_TELEGRAM_OCI_BOT_TOKEN }}
          KATCHA_TELEGRAM_CHAT_ID: ${{ secrets.KATCHA_TELEGRAM_OCI_CHAT_ID }}
          KATCHA_TELEGRAM_THREAD_ID: ${{ vars.KATCHA_TELEGRAM_THREAD_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${KATCHA_TELEGRAM_BOT_TOKEN}" || -z "${KATCHA_TELEGRAM_CHAT_ID}" ]]; then
            echo "::warning::Telegram review alert not configured in repository Actions secrets."
            exit 0
          fi
          # authorize-request enters the protected Environment in parallel.
          # Observe the real pending-deployments API, not workflow success.
          pending=false
          for attempt in {1..18}; do
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/pending_deployments" \
              --jq '.[] | select(.environment.name == "katcha-production") | .environment.name' \
              | grep -qx 'katcha-production'; then
              pending=true
              break
            fi
            sleep 5
          done
          if [[ "$pending" != true ]]; then
            echo "No pending Environment review observed (may already be approved)."
            exit 0
          fi
          review_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          message="$(printf 'Katcha PRODUCTION DEPLOYMENT REVIEW REQUESTED\nRelease: %s\nProtected Environment: katcha-production\nReview this exact GitHub Actions run:\n%s\n\nApproval authorizes a signed request only; deployment is not yet complete.' \
            "${TARGET_SHA}" "${review_url}")"
          if ! bash scripts/notify-telegram.sh "$message"; then
            echo "::warning::Telegram review notification failed; deployment approval is not changed."
          fi

  authorize-request:
    needs: preflight
    if: github.event_name == 'workflow_dispatch'
    environment: katcha-production
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Publish short-lived signed production request (no OCI credentials)
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ inputs.release_sha }}
          POLICY: ${{ inputs.running_workflows }}
          MIGRATION_POLICY: ${{ inputs.migration_policy }}
          DEPLOY_KEY: ${{ secrets.KATCHA_PRODUCTION_DEPLOY_HMAC_KEY }}
          ENABLED: ${{ vars.KATCHA_PRODUCTION_DEPLOY_ENABLED }}
        with:
          script: |
            const crypto = require("crypto");
            const sha = process.env.TARGET_SHA;
            const policy = process.env.POLICY;
            const migrationPolicy = process.env.MIGRATION_POLICY;
            const key = process.env.DEPLOY_KEY || "";
            // Keep each failure distinct. Never print the signing key, its
            // length, or HMAC input; only report the failed requirement.
            if (process.env.ENABLED !== "true") {
              throw new Error(
                "GITHUB_DEPLOY_GATE_DISABLED: KATCHA_PRODUCTION_DEPLOY_ENABLED " +
                "is not true in the protected katcha-production job. Keep " +
                "the repository Actions variable true through authorization; " +
                "check for a conflicting Environment-level variable of the same name."
              );
            }
            if (!/^[0-9a-f]{64}$/.test(key)) {
              throw new Error(
                "GITHUB_DEPLOY_SIGNING_SECRET_INVALID: " +
                "KATCHA_PRODUCTION_DEPLOY_HMAC_KEY is missing or invalid " +
                "in the protected katcha-production Environment. " +
                "Provision the same 32-byte lowercase-hex key held by OCI. " +
                "Never print the key."
              );
            }
            if (!/^[0-9a-f]{40}$/.test(sha || "")) {
              throw new Error("GITHUB_DEPLOY_SHA_INVALID: exact 40-character release SHA required");
            }
            if (!["refuse", "approved-resume"].includes(policy)) {
              throw new Error("GITHUB_DEPLOY_WORKFLOW_POLICY_INVALID");
            }
            if (!["refuse", "approve-additive-0064", "approve-additive-through-0065", "approve-additive-through-0066"].includes(migrationPolicy)) {
              throw new Error("GITHUB_DEPLOY_MIGRATION_POLICY_INVALID");
            }
            if (context.ref !== "refs/heads/main") {
              throw new Error("GITHUB_DEPLOY_BRANCH_INVALID: dispatch from main");
            }
            const main = await github.rest.repos.getBranch({
              owner: context.repo.owner, repo: context.repo.repo, branch: "main"
            });
            if (main.data.commit.sha !== sha) {
              const {data: ancestry} = await github.rest.repos.compareCommitsWithBasehead({
                owner: context.repo.owner, repo: context.repo.repo,
                basehead: sha + "..." + main.data.commit.sha
              });
              if (ancestry.status !== "ahead" ||
                  ancestry.behind_by !== 0 ||
                  ancestry.merge_base_commit?.sha !== sha) {
                throw new Error("Pinned candidate is not an accepted main ancestor");
              }
            }
            const issued_at = Math.floor(Date.now() / 1000);
            const expires_at = issued_at + 1200;
            const nonce = crypto.randomBytes(16).toString("hex");
            const host = "katcha-prod-primary-001";
            const message = ["katcha-production-v2", sha, policy, migrationPolicy, host,
                             String(issued_at), String(expires_at), nonce].join("\n");
            const signature = crypto.createHmac("sha256", Buffer.from(key, "hex"))
              .update(message, "utf8").digest("hex");
            const {data} = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
              task: "deploy",
              auto_merge: false,
              required_contexts: [],
              environment: "katcha-production",
              description: "Approved production promotion request; host independently verifies",
              transient_environment: false,
              production_environment: true,
              payload: {
                version: 2, sha, policy, migration_policy: migrationPolicy,
                host, issued_at, expires_at, nonce, signature
              }
            });
            core.info("Production deployment request published: id=" + data.id +
                      " sha=" + sha + " host=existing-oci-primary");
            core.notice("Request submitted, NOT deployed. OCI poller verifies and executes independently.");
