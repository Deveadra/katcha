name: Temporary renderer lockfile bootstrap (issue 526)
on:
  pull_request:
    paths:
      - .github/workflows/renderer-lock-bootstrap.yml
permissions:
  contents: write
jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/526-renderer-reproducible-installs'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate lock only, without running dependency scripts
        working-directory: renderer
        run: |
          npm --version
          timeout --signal=TERM --kill-after=10s 600s npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -s package-lock.json
          node -e "const p=require('./package-lock.json'); if(p.lockfileVersion !== 3 || p.packages[''].name !== 'katcha-renderer') process.exit(1)"
          sha256sum package-lock.json
      - name: Confirm clean installation from lockfile
        working-directory: renderer
        run: timeout --signal=TERM --kill-after=10s 420s npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile to this same-repository PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f renderer/package-lock.json
          git diff --cached --check
          git commit -m "chore(renderer): generate npm 10 dependency lockfile"
          git push origin HEAD:refs/heads/fix/526-renderer-reproducible-installs
