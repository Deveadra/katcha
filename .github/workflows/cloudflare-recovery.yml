name: Cloudflare recovery coordinator

on:
  pull_request:
    paths:
      - .github/workflows/cloudflare-recovery.yml
      - infra/cloudflare-recovery/**
      - src/katcha/ops/external_compute_budget.py
      - src/katcha/ops/oci_recovery.py
      - tests/test_external_compute_budget.py
      - tests/test_cloud_runtime_contract.py
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  recovery-coordinator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache Wrangler npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: cloudflare-recovery-npm-${{ runner.os }}-wrangler-4.146.0

      - name: Test authority state machine
        run: node --test infra/cloudflare-recovery/test/*.test.mjs

      - name: Validate Worker bundle and Durable Object configuration
        run: >-
          npx --yes wrangler@4.146.0 deploy
          --dry-run
          --config infra/cloudflare-recovery/wrangler.jsonc
