name: Publish runtime images

on:
  # Only a successful full CI run for a push to main can publish images.
  # PRs continue to build without publishing.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/runtime-images.yml
      - Dockerfile
      - Dockerfile.analysis
      - Dockerfile.control
      - Dockerfile.production
      - Dockerfile.renderer
      - Dockerfile.minio
      - pyproject.toml
      - renderer/**

permissions:
  contents: read
  packages: write
  pull-requests: read

concurrency:
  # Unrelated scheduled CI must not cancel an already-running main image build.
  # Serialize real main publications; cancel superseded PR-only builds.
  group: runtime-images-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && 'main-publish' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan runtime image builds
    # Scheduled/manual/failed CI is never an image-publication attempt.
    # Keep the in-step SHA and repository checks as a second independent gate.
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_images: ${{ steps.plan.outputs.has_images }}
      release_sha: ${{ steps.plan.outputs.release_sha }}
    steps:
      - name: Select images and platforms
        id: plan
        uses: actions/github-script@v7
        with:
          script: |
            const definitions = [
              {image: "katcha-control", dockerfile: "Dockerfile.control", multi: true},
              {image: "katcha-ingest", dockerfile: "Dockerfile", multi: true},
              {image: "katcha-analysis", dockerfile: "Dockerfile.analysis", multi: true},
              {image: "katcha-renderer", dockerfile: "Dockerfile.renderer", multi: true},
              {image: "katcha-production", dockerfile: "Dockerfile.production", multi: true},
              {image: "katcha-minio", dockerfile: "Dockerfile.minio", multi: false},
            ];

            let selected = definitions;
            let releaseSha = context.sha;
            if (context.eventName === "workflow_run") {
              const run = context.payload.workflow_run;
              if (
                run?.event !== "push" ||
                run?.conclusion !== "success" ||
                run?.head_branch !== "main" ||
                run?.head_repository?.full_name !== context.repo.owner + "/" + context.repo.repo ||
                !/^[0-9a-f]{40}$/.test(run?.head_sha || "")
              ) {
                core.setFailed("Rejected image publication: CI was not a successful push to this repository's main.");
                core.setOutput("matrix", JSON.stringify({include: []}));
                core.setOutput("has_images", "false");
                core.setOutput("release_sha", "");
                return;
              }
              const main = await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: "main",
              });
              if (main.data.commit.sha !== run.head_sha) {
                core.setFailed("Rejected image publication: CI revision is no longer main HEAD.");
                core.setOutput("matrix", JSON.stringify({include: []}));
                core.setOutput("has_images", "false");
                core.setOutput("release_sha", "");
                return;
              }
              releaseSha = run.head_sha;
            }
            if (context.eventName === "pull_request") {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
              });
              const names = new Set(files.map((file) => file.filename));
              const allImages =
                names.has(".github/workflows/runtime-images.yml") ||
                names.has(".dockerignore");
              const sharedPython = names.has("pyproject.toml");
              const rendererChanged = [...names].some((name) => name.startsWith("renderer/"));

              selected = definitions.filter(({image, dockerfile}) => {
                if (allImages || names.has(dockerfile)) return true;
                if (
                  sharedPython &&
                  ["katcha-control", "katcha-ingest", "katcha-analysis", "katcha-production"].includes(image)
                ) return true;
                return image === "katcha-renderer" && rendererChanged;
              });
            }

            const include = selected.map(({image, dockerfile, multi}) => ({
              image,
              dockerfile,
              platforms:
                context.eventName === "pull_request" || !multi
                  ? "linux/amd64"
                  : "linux/amd64,linux/arm64",
            }));
            core.setOutput("matrix", JSON.stringify({include}));
            core.setOutput("has_images", include.length ? "true" : "false");
            core.setOutput("release_sha", releaseSha);
            core.info(`Selected runtime images: ${include.map((entry) => entry.image).join(", ") || "none"}`);

  build:
    name: ${{ matrix.image }} (${{ matrix.platforms }})
    needs: plan
    if: needs.plan.outputs.has_images == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.release_sha }}
          persist-credentials: false

      - uses: docker/setup-qemu-action@v3
        if: github.event_name != 'pull_request'

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build exact revision before release recheck
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: false
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ghcr.io/deveadra/${{ matrix.image }}:${{ needs.plan.outputs.release_sha }}
            ghcr.io/deveadra/${{ matrix.image }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.plan.outputs.release_sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Load native workspace image for offline acceptance
        if: github.event_name == 'workflow_run' && (matrix.image == 'katcha-control' || matrix.image == 'katcha-production')
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          tags: ghcr.io/deveadra/${{ matrix.image }}:${{ needs.plan.outputs.release_sha }}
          cache-from: type=gha,scope=${{ matrix.image }}

      - name: Verify built workspace routes and media tools offline
        if: matrix.image == 'katcha-control' || matrix.image == 'katcha-production'
        timeout-minutes: 2
        env:
          IMAGE: ${{ matrix.image }}
          RELEASE_SHA: ${{ needs.plan.outputs.release_sha }}
        run: |
          set -euo pipefail
          role="${IMAGE#katcha-}"
          docker run --rm --network none --read-only --tmpfs /tmp:rw,size=32m \
            --cap-drop ALL --security-opt no-new-privileges \
            "ghcr.io/deveadra/${IMAGE}:${RELEASE_SHA}" \
            python -m katcha.ops.workspace_runtime_probe "$role"

      - name: Recheck current main immediately before publication
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ needs.plan.outputs.release_sha }}
        with:
          script: |
            const main = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: "main",
            });
            if (main.data.commit.sha !== process.env.RELEASE_SHA) {
              core.setFailed("Rejected image publication: main advanced while images were building.");
            }

      - name: Publish cached exact revision
        if: github.event_name == 'workflow_run'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name == 'workflow_run' }}
          tags: |
            ghcr.io/deveadra/${{ matrix.image }}:${{ needs.plan.outputs.release_sha }}
            ghcr.io/deveadra/${{ matrix.image }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.plan.outputs.release_sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  verify-public:
    name: Verify anonymous runtime pulls
    needs: [plan, build]
    if: github.event_name == 'workflow_run' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_TAG: ${{ needs.plan.outputs.release_sha }}
    steps:
      - name: Pull runtime images without a registry login
        shell: bash
        run: |
          set -euo pipefail
          images=(
            katcha-control
            katcha-ingest
            katcha-analysis
            katcha-renderer
            katcha-production
            katcha-minio
          )
          for image in "${images[@]}"; do
            ref="ghcr.io/deveadra/${image}:${IMAGE_TAG}"
            echo "Anonymous pull: ${ref}"
            docker pull "${ref}"
            revision="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${ref}")"
            test "${revision}" = "${IMAGE_TAG}"
            if [[ "$image" = katcha-control || "$image" = katcha-production ]]; then
              docker run --rm --network none --read-only --tmpfs /tmp:rw,size=32m \
                --cap-drop ALL --security-opt no-new-privileges "$ref" \
                python -m katcha.ops.workspace_runtime_probe "${image#katcha-}"
            fi
          done
