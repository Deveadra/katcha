name: Publish runtime images

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/runtime-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: runtime-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name != 'pull_request'
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: katcha-control
            dockerfile: Dockerfile.control
          - image: katcha-ingest
            dockerfile: Dockerfile
          - image: katcha-analysis
            dockerfile: Dockerfile.analysis
          - image: katcha-renderer
            dockerfile: Dockerfile.renderer
          - image: katcha-production
            dockerfile: Dockerfile.production
          - image: katcha-minio
            dockerfile: Dockerfile.minio
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish exact revision
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/deveadra/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/deveadra/${{ matrix.image }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  verify-public:
    name: Verify anonymous runtime pulls
    needs: publish
    if: ${{ always() && (github.event_name == 'pull_request' || needs.publish.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_TAG: ${{ github.event_name == 'pull_request' && 'main' || github.sha }}
    steps:
      - name: Pull runtime images without a registry login
        shell: bash
        run: |
          set -euo pipefail
          images=(
            katcha-control
            katcha-ingest
            katcha-analysis
            katcha-renderer
            katcha-production
            katcha-minio
          )
          for image in "${images[@]}"; do
            ref="ghcr.io/deveadra/${image}:${IMAGE_TAG}"
            echo "Anonymous pull: ${ref}"
            docker pull "${ref}"
            if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
              revision="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${ref}")"
              test "${revision}" = "${GITHUB_SHA}"
            fi
          done
