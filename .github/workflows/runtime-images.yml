name: Publish runtime images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: runtime-images-main
  cancel-in-progress: true

jobs:
  publish:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: katcha-control
            dockerfile: Dockerfile.control
          - image: katcha-ingest
            dockerfile: Dockerfile
          - image: katcha-analysis
            dockerfile: Dockerfile.analysis
          - image: katcha-renderer
            dockerfile: Dockerfile.renderer
          - image: katcha-production
            dockerfile: Dockerfile.production
          - image: katcha-minio
            dockerfile: Dockerfile.minio
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish exact revision
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/deveadra/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/deveadra/${{ matrix.image }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
