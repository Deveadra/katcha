name: Publish runtime images

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/runtime-images.yml
      - Dockerfile
      - Dockerfile.analysis
      - Dockerfile.control
      - Dockerfile.production
      - Dockerfile.renderer
      - Dockerfile.minio
      - pyproject.toml
      - renderer/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: read

concurrency:
  group: runtime-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan runtime image builds
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_images: ${{ steps.plan.outputs.has_images }}
    steps:
      - name: Select images and platforms
        id: plan
        uses: actions/github-script@v7
        with:
          script: |
            const definitions = [
              {image: "katcha-control", dockerfile: "Dockerfile.control", multi: true},
              {image: "katcha-ingest", dockerfile: "Dockerfile", multi: true},
              {image: "katcha-analysis", dockerfile: "Dockerfile.analysis", multi: true},
              {image: "katcha-renderer", dockerfile: "Dockerfile.renderer", multi: true},
              {image: "katcha-production", dockerfile: "Dockerfile.production", multi: true},
              {image: "katcha-minio", dockerfile: "Dockerfile.minio", multi: false},
            ];

            let selected = definitions;
            if (context.eventName === "pull_request") {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
              });
              const names = new Set(files.map((file) => file.filename));
              const allImages =
                names.has(".github/workflows/runtime-images.yml") ||
                names.has(".dockerignore");
              const sharedPython = names.has("pyproject.toml");
              const rendererChanged = [...names].some((name) => name.startsWith("renderer/"));

              selected = definitions.filter(({image, dockerfile}) => {
                if (allImages || names.has(dockerfile)) return true;
                if (
                  sharedPython &&
                  ["katcha-control", "katcha-ingest", "katcha-analysis", "katcha-production"].includes(image)
                ) return true;
                return image === "katcha-renderer" && rendererChanged;
              });
            }

            const include = selected.map(({image, dockerfile, multi}) => ({
              image,
              dockerfile,
              platforms:
                context.eventName === "pull_request" || !multi
                  ? "linux/amd64"
                  : "linux/amd64,linux/arm64",
            }));
            core.setOutput("matrix", JSON.stringify({include}));
            core.setOutput("has_images", include.length ? "true" : "false");
            core.info(`Selected runtime images: ${include.map((entry) => entry.image).join(", ") || "none"}`);

  build:
    name: ${{ matrix.image }} (${{ matrix.platforms }})
    needs: plan
    if: needs.plan.outputs.has_images == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v3
        if: github.event_name != 'pull_request'

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish exact revision
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/deveadra/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/deveadra/${{ matrix.image }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  verify-public:
    name: Verify anonymous runtime pulls
    needs: build
    if: github.event_name != 'pull_request' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Pull runtime images without a registry login
        shell: bash
        run: |
          set -euo pipefail
          images=(
            katcha-control
            katcha-ingest
            katcha-analysis
            katcha-renderer
            katcha-production
            katcha-minio
          )
          for image in "${images[@]}"; do
            ref="ghcr.io/deveadra/${image}:${IMAGE_TAG}"
            echo "Anonymous pull: ${ref}"
            docker pull "${ref}"
            revision="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${ref}")"
            test "${revision}" = "${GITHUB_SHA}"
          done
