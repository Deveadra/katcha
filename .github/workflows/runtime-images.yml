name: Publish runtime images

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/runtime-images.yml
      - Dockerfile
      - Dockerfile.analysis
      - Dockerfile.control
      - Dockerfile.production
      - Dockerfile.renderer
      - Dockerfile.minio
      - pyproject.toml
      - renderer/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: runtime-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.image }} (${{ matrix.platforms }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: katcha-control
            dockerfile: Dockerfile.control
            platforms: linux/amd64,linux/arm64
          - image: katcha-ingest
            dockerfile: Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: katcha-analysis
            dockerfile: Dockerfile.analysis
            platforms: linux/amd64,linux/arm64
          - image: katcha-renderer
            dockerfile: Dockerfile.renderer
            platforms: linux/amd64,linux/arm64
          - image: katcha-production
            dockerfile: Dockerfile.production
            platforms: linux/amd64,linux/arm64
          - image: katcha-minio
            dockerfile: Dockerfile.minio
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish exact revision
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/deveadra/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/deveadra/${{ matrix.image }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  verify-public:
    name: Verify anonymous runtime pulls
    needs: build
    if: github.event_name != 'pull_request' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Pull runtime images without a registry login
        shell: bash
        run: |
          set -euo pipefail
          images=(
            katcha-control
            katcha-ingest
            katcha-analysis
            katcha-renderer
            katcha-production
            katcha-minio
          )
          for image in "${images[@]}"; do
            ref="ghcr.io/deveadra/${image}:${IMAGE_TAG}"
            echo "Anonymous pull: ${ref}"
            docker pull "${ref}"
            revision="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${ref}")"
            test "${revision}" = "${GITHUB_SHA}"
          done
