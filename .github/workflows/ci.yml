name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Plan affected checks
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      python: ${{ steps.plan.outputs.python }}
      terraform: ${{ steps.plan.outputs.terraform }}
      acceptance_media: ${{ steps.plan.outputs.acceptance_media }}
      temporal: ${{ steps.plan.outputs.temporal }}
      storage: ${{ steps.plan.outputs.storage }}
      renderer: ${{ steps.plan.outputs.renderer }}
      explorer: ${{ steps.plan.outputs.explorer }}
    steps:
      - name: Classify changed files
        id: plan
        uses: actions/github-script@v7
        with:
          script: |
            const groups = [
              "python",
              "terraform",
              "acceptance_media",
              "temporal",
              "storage",
              "renderer",
              "explorer",
            ];

            if (context.eventName !== "pull_request") {
              for (const group of groups) core.setOutput(group, "true");
              core.info("Full validation selected for main, scheduled, or manual run.");
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const names = files.map((file) => file.filename);
            const has = (predicate) => names.some(predicate);
            const exact = (...paths) => has((name) => paths.includes(name));
            const prefix = (...prefixes) => has((name) =>
              prefixes.some((value) => name.startsWith(value))
            );
            const ciChanged = exact(".github/workflows/ci.yml");

            const outputs = {
              python:
                ciChanged ||
                prefix(
                  "src/",
                  "tests/",
                  "alembic/",
                  "scripts/",
                  "deploy/scripts/",
                  "deploy/cloud-init/"
                ) ||
                exact(
                  "alembic.ini",
                  "pyproject.toml",
                  ".env.example",
                  "docker-compose.yml",
                  "docker-compose.discovery.yml",
                  "docker-compose.trends.yml",
                  "docker-compose.intelligence.yml",
                  "docker-compose.acceptance.yml",
                  "docker-compose.aws-render.yml",
                  "docker-compose.aws-roles-anywhere.yml",
                  "docker-compose.aws-lambda-acceptance.yml"
                ),
              terraform:
                ciChanged ||
                prefix("infra/aws-render-staging/") ||
                has((name) => name.startsWith("scripts/aws_") || name.startsWith("scripts/test_aws_")),
              acceptance_media:
                ciChanged ||
                exact("docker-compose.acceptance.yml", "Dockerfile", ".env.example"),
              temporal:
                ciChanged ||
                prefix("dynamicconfig/") ||
                exact("docker-compose.yml", ".env.example"),
              storage:
                ciChanged ||
                exact("Dockerfile.minio", "docker-compose.yml", ".env.example"),
              renderer:
                ciChanged ||
                prefix("renderer/", "src/katcha/rendering/") ||
                exact(
                  "Dockerfile.renderer",
                  "scripts/ranked_renderer_smoke.py",
                  "docker-compose.yml",
                  "tests/test_editorial_render.py",
                  "tests/test_editorial_visual_compiler.py",
                  "tests/test_ranked_episode_rendering.py",
                  "tests/test_reaction_rendering.py",
                  "tests/test_render_recovery_automation.py",
                  "tests/test_renderer_diagnostics.py",
                  "tests/test_brand_previews.py",
                  "tests/test_packaging_thumbnails.py"
                ),
              explorer:
                ciChanged ||
                prefix("web-tests/", "src/katcha/web/") ||
                has((name) => name.startsWith("src/katcha/api/")),
            };

            for (const [group, enabled] of Object.entries(outputs)) {
              core.setOutput(group, enabled ? "true" : "false");
              core.info(`${group}: ${enabled}`);
            }
            core.info(`Changed files: ${names.join(", ")}`);

  python:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: katcha
          POSTGRES_PASSWORD: katcha
          POSTGRES_DB: katcha
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U katcha -d katcha"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint
        run: ruff check src tests

      - name: Compile
        run: python -m compileall -q src

      - name: Validate migration graph
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          heads = ScriptDirectory.from_config(Config("alembic.ini")).get_heads()
          if len(heads) != 1:
              raise SystemExit(f"expected exactly one Alembic head, found: {heads}")
          print(f"Alembic head: {heads[0]}")
          PY

      - name: Import smoke
        run: |
          python -c "import katcha.api.main; import katcha.api.trends; import katcha.orchestration.publishing_worker; import katcha.orchestration.longform_worker; import katcha.orchestration.intelligence_worker; import katcha.orchestration.discovery_worker; import katcha.orchestration.trend_worker"

      - name: Apply migrations to fresh PostgreSQL
        env:
          KATCHA_DATABASE_URL: postgresql+psycopg://katcha:katcha@127.0.0.1:5432/katcha
        run: alembic upgrade head

      - name: Verify media decoder compatibility
        run: |
          pip install -e '.[media]'
          pytest -q tests/test_media_decode.py

      - name: Test
        run: pytest -q

      - name: Verify built-in brand assets through S3-compatible HTTP endpoint
        env:
          KATCHA_S3_ENDPOINT_URL: http://127.0.0.1:19000
          KATCHA_S3_ACCESS_KEY: katcha
          KATCHA_S3_SECRET_KEY: katcha-local-secret
          KATCHA_S3_BUCKET: katcha-media
          KATCHA_S3_REGION: us-east-1
          KATCHA_S3_FORCE_PATH_STYLE: "true"
        run: |
          python -m pip install 'moto[server]>=5,<6'
          moto_server -H 127.0.0.1 -p 19000 >/tmp/katcha-moto.log 2>&1 &
          moto_pid=$!
          trap 'kill "$moto_pid" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:19000/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/katcha-moto.log
              exit 1
            fi
            sleep 1
          done
          python - <<'PY'
          import hashlib

          from katcha.integrations.storage import ObjectStore
          from katcha.services.brand_assets import BUILTIN_BRAND_ASSETS, seed_builtin_brand_assets

          first = seed_builtin_brand_assets()
          second = seed_builtin_brand_assets()
          if first[0]["action"] != "seeded":
              raise SystemExit(f"expected first seed to upload asset: {first}")
          if second[0]["action"] != "verified":
              raise SystemExit(f"expected second seed to verify existing asset: {second}")

          asset = BUILTIN_BRAND_ASSETS[0]
          store = ObjectStore()
          stored = store.get_bytes(asset.storage_key)
          digest = hashlib.sha256(stored).hexdigest()
          if digest != asset.sha256:
              raise SystemExit(
                  f"stored brand asset checksum mismatch: expected {asset.sha256}, got {digest}"
              )
          stat = store.stat(asset.storage_key)
          if stat["size_bytes"] != len(stored):
              raise SystemExit("stored brand asset size mismatch")
          print(
              f"verified {asset.storage_key} sha256={digest} size={stat['size_bytes']}"
          )
          PY

      - name: Validate AWS render scripts
        run: |
          bash -n scripts/aws_render_preflight.sh
          bash -n scripts/aws_lambda_render_acceptance.sh
          bash -n scripts/aws_lambda_backend_enable.sh
          bash -n scripts/test_aws_lambda_backend_enable.sh
          bash -n scripts/aws_render_authorize.sh
          bash -n scripts/aws_remotion_deploy.sh
          bash -n scripts/aws_render_staging.sh
          bash -n scripts/aws_roles_anywhere_bootstrap.sh
          bash -n scripts/aws_tf_state_bootstrap.sh
          bash -n scripts/aws_render_staging_deploy.sh
          bash -n scripts/test_aws_render_preflight.sh
          bash -n scripts/test_aws_render_staging_deploy.sh
          bash -n scripts/test_aws_render_authorize.sh
          bash -n scripts/test_aws_remotion_deploy.sh
          bash -n scripts/test_aws_render_staging.sh
          bash -n scripts/test_aws_tf_state_bootstrap.sh
          bash scripts/aws_lambda_render_acceptance.sh --help >/dev/null
          bash scripts/aws_lambda_backend_enable.sh --help >/dev/null
          bash scripts/test_aws_lambda_backend_enable.sh
          bash scripts/aws_render_authorize.sh --help >/dev/null
          bash scripts/aws_remotion_deploy.sh --help >/dev/null
          bash scripts/aws_render_staging.sh --help >/dev/null
          bash scripts/aws_roles_anywhere_bootstrap.sh --help >/dev/null
          bash scripts/aws_tf_state_bootstrap.sh --help >/dev/null
          bash scripts/aws_render_staging_deploy.sh --help >/dev/null
          bash scripts/test_aws_render_preflight.sh
          bash scripts/test_aws_render_staging_deploy.sh
          bash scripts/test_aws_render_authorize.sh
          bash scripts/test_aws_remotion_deploy.sh
          bash scripts/test_aws_render_staging.sh
          bash scripts/test_aws_tf_state_bootstrap.sh

      - name: Validate OCI production operator tooling
        run: |
          bash -n scripts/bootstrap-acquired-oci-host.sh
          bash -n deploy/scripts/production-supervisor.sh
          python -m py_compile \
            scripts/oci_production_cutover.py \
            scripts/verify_media_cutover.py
          python scripts/oci_production_cutover.py --help >/dev/null
          python scripts/verify_media_cutover.py --help >/dev/null

      - name: Validate Compose
        env:
          KATCHA_ENV_FILE: .env.example
        run: |
          docker compose --env-file .env.example config >/dev/null
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.intelligence.yml config >/dev/null
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.discovery.yml config >/dev/null
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.trends.yml config >/dev/null
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.acceptance.yml config >/dev/null
          AWS_PROFILE=katcha-ci KATCHA_HOST_UID=1000 KATCHA_HOST_GID=1000 HOME=/tmp docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.aws-render.yml config >/dev/null
          KATCHA_AWS_PROFILE=katcha-ci KATCHA_HOST_UID=1000 KATCHA_HOST_GID=1000 HOME=/tmp KATCHA_AWS_SIGNING_HELPER_PATH=/tmp/aws_signing_helper KATCHA_AWS_CERT_PATH=/tmp/client.pem KATCHA_AWS_PRIVATE_KEY_PATH=/tmp/client-key.pem docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.aws-render.yml -f docker-compose.aws-roles-anywhere.yml config >/dev/null
          KATCHA_AWS_PROFILE=katcha-ci KATCHA_HOST_UID=1000 KATCHA_HOST_GID=1000 HOME=/tmp KATCHA_AWS_SIGNING_HELPER_PATH=/tmp/aws_signing_helper KATCHA_AWS_CERT_PATH=/tmp/client.pem KATCHA_AWS_PRIVATE_KEY_PATH=/tmp/client-key.pem docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.aws-render.yml -f docker-compose.aws-roles-anywhere.yml -f docker-compose.aws-lambda-acceptance.yml config >/dev/null


  terraform:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.4"

      - name: Format check
        run: terraform fmt -check -recursive infra/aws-render-staging

      - name: Initialize without backend
        run: terraform -chdir=infra/aws-render-staging init -backend=false -input=false

      - name: Validate staging infrastructure
        run: terraform -chdir=infra/aws-render-staging validate

  acceptance-media:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.acceptance_media == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KATCHA_ENV_FILE: .env.example
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start synthetic acceptance media
        run: |
          docker compose --env-file .env.example \
            -f docker-compose.yml \
            -f docker-compose.acceptance.yml \
            up -d --build acceptance-media

      - name: Verify all five fixture clips
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS -o /tmp/clip-1.mp4 http://127.0.0.1:8090/clip-1.mp4; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose --env-file .env.example \
                -f docker-compose.yml \
                -f docker-compose.acceptance.yml \
                logs acceptance-media
              exit 1
            fi
            sleep 2
          done
          for index in 1 2 3 4 5; do
            curl -fsS -o "/tmp/clip-${index}.mp4" "http://127.0.0.1:8090/clip-${index}.mp4"
            test -s "/tmp/clip-${index}.mp4"
          done

      - name: Tear down acceptance media
        if: always()
        run: |
          docker compose --env-file .env.example \
            -f docker-compose.yml \
            -f docker-compose.acceptance.yml \
            down

  temporal-smoke:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.temporal == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KATCHA_ENV_FILE: .env.example
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start PostgreSQL and Temporal
        run: |
          docker compose --env-file .env.example up -d postgres temporal

      - name: Verify Temporal becomes healthy
        run: |
          for attempt in $(seq 1 60); do
            status="$(docker inspect --format='{{.State.Health.Status}}' katcha-temporal-1 2>/dev/null || true)"
            if [ "$status" = "healthy" ]; then
              docker compose --env-file .env.example ps postgres temporal
              exit 0
            fi
            if ! docker ps -a --format '{{.Names}} {{.Status}}' | grep -q '^katcha-temporal-1 '; then
              echo "Temporal container was not created"
              docker logs katcha-temporal-1
              exit 1
            fi
            if docker ps -a --format '{{.Names}} {{.Status}}' | grep '^katcha-temporal-1 ' | grep -q 'Exited'; then
              echo "Temporal exited before becoming healthy"
              docker logs katcha-temporal-1
              exit 1
            fi
            sleep 2
          done
          docker compose --env-file .env.example ps postgres temporal
          docker logs katcha-temporal-1
          exit 1

      - name: Tear down Temporal smoke stack
        if: always()
        run: docker compose --env-file .env.example down -v

  storage-image:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.storage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build pinned local MinIO image
        run: docker build -f Dockerfile.minio -t katcha-minio-ci .

      - name: Verify MinIO starts and becomes healthy
        run: |
          docker run -d \
            --name katcha-minio-ci \
            -p 19000:9000 \
            -e MINIO_ROOT_USER=katcha \
            -e MINIO_ROOT_PASSWORD=katcha-local-secret \
            katcha-minio-ci
          trap 'docker rm -f katcha-minio-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:19000/minio/health/live >/dev/null; then
              docker run --rm katcha-minio-ci --version
              exit 0
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs katcha-minio-ci
              exit 1
            fi
            sleep 2
          done

  renderer:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.renderer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: renderer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache renderer npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: renderer-npm-${{ runner.os }}-${{ hashFiles('renderer/package.json') }}
          restore-keys: |
            renderer-npm-${{ runner.os }}-

      - name: Install renderer dependencies
        run: npm install --ignore-scripts

      - name: Validate renderer runtime and cloud safety settings
        run: npm run test:config

      - name: Enforce single ranked video decoder
        run: node test/ranked-decoder-invariant.mjs

      - name: Bundle Remotion composition
        run: |
          node --input-type=module -e "
          import path from 'node:path';
          import {bundle} from '@remotion/bundler';
          const serveUrl = await bundle({entryPoint: path.resolve('src/entry.jsx')});
          if (!serveUrl) process.exit(1);
          console.log(serveUrl);
          "

      - name: Ensure headless browser and FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          npx remotion browser ensure

      - name: Encode and verify both reaction overlays
        run: node test/reaction-smoke.mjs

      - name: Encode and verify channel editing blueprints
        run: node test/blueprint-smoke.mjs

      - name: Render and verify grounded thumbnail still
        run: node test/thumbnail-smoke.mjs

      - name: Upload branded reaction previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ranksnaxx-reaction-previews
          path: renderer/reaction-smoke-previews/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload synthetic blueprint previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-blueprint-previews
          path: renderer/blueprint-smoke-previews/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload synthetic thumbnail preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-thumbnail-preview
          path: renderer/thumbnail-smoke-previews/
          if-no-files-found: ignore
          retention-days: 7


  ranked-render-e2e:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.renderer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KATCHA_ENV_FILE: .env.example
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python package and FFmpeg
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Start MinIO and renderer
        run: |
          docker compose --env-file .env.example             up -d --build minio minio-init renderer
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null; then
              exit 0
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose --env-file .env.example logs minio minio-init renderer
              exit 1
            fi
            sleep 2
          done

      - name: Render five-item ranked episode through HTTP and S3
        env:
          KATCHA_S3_ENDPOINT_URL: http://127.0.0.1:9000
          KATCHA_S3_ACCESS_KEY: katcha
          KATCHA_S3_SECRET_KEY: katcha-local-secret
          KATCHA_S3_BUCKET: katcha-media
          KATCHA_S3_REGION: us-east-1
          KATCHA_S3_FORCE_PATH_STYLE: "true"
          KATCHA_RENDERER_URL: http://127.0.0.1:8787
        run: python scripts/ranked_renderer_smoke.py

      - name: Print renderer logs on failure
        if: failure()
        run: docker compose --env-file .env.example logs --no-color renderer minio

      - name: Tear down ranked render stack
        if: always()
        run: docker compose --env-file .env.example down -v

  explorer:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.explorer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-tests/package-lock.json
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('web-tests/package-lock.json') }}
      - name: Install browser test dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate explorer interactions and responsive layout
        run: npm test
      - name: Upload explorer screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explorer-screenshots
          path: web-tests/test-results/
          if-no-files-found: ignore
          retention-days: 7


  pr-gate:
    name: PR Gate
    if: always()
    needs:
      - changes
      - python
      - terraform
      - acceptance-media
      - temporal-smoke
      - storage-image
      - renderer
      - ranked-render-e2e
      - explorer
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every selected check to pass
        env:
          CHECK_RESULTS: ${{ toJson(needs) }}
        run: |
          python - <<'PY'
          import json
          import os

          checks = json.loads(os.environ["CHECK_RESULTS"])
          failed = {
              name: data.get("result")
              for name, data in checks.items()
              if data.get("result") not in {"success", "skipped"}
          }
          if failed:
              raise SystemExit(f"selected CI checks did not pass: {failed}")
          print("PASS: every selected CI check passed; irrelevant checks were skipped.")
          PY
