name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint
        run: ruff check src tests

      - name: Compile
        run: python -m compileall -q src

      - name: Validate migration graph
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          heads = ScriptDirectory.from_config(Config("alembic.ini")).get_heads()
          if len(heads) != 1:
              raise SystemExit(f"expected exactly one Alembic head, found: {heads}")
          print(f"Alembic head: {heads[0]}")
          PY

      - name: Import smoke
        run: |
          python -c "import katcha.api.main; import katcha.api.trends; import katcha.orchestration.publishing_worker; import katcha.orchestration.longform_worker; import katcha.orchestration.intelligence_worker; import katcha.orchestration.discovery_worker; import katcha.orchestration.trend_worker"

      - name: Test
        run: pytest -q

      - name: Verify built-in brand assets against real MinIO
        env:
          KATCHA_S3_ENDPOINT_URL: http://localhost:19000
          KATCHA_S3_ACCESS_KEY: katcha
          KATCHA_S3_SECRET_KEY: katcha-local-secret
          KATCHA_S3_BUCKET: katcha-media
          KATCHA_S3_REGION: auto
          KATCHA_S3_FORCE_PATH_STYLE: "true"
        run: |
          docker run -d --rm --name katcha-brand-asset-minio \
            -p 19000:9000 \
            -e MINIO_ROOT_USER=katcha \
            -e MINIO_ROOT_PASSWORD=katcha-local-secret \
            minio/minio:latest server /data
          trap 'docker rm -f katcha-brand-asset-minio >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:19000/minio/health/live >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs katcha-brand-asset-minio
              exit 1
            fi
            sleep 1
          done
          python - <<'PY'
          import hashlib

          from katcha.integrations.storage import ObjectStore
          from katcha.services.brand_assets import BUILTIN_BRAND_ASSETS, seed_builtin_brand_assets

          first = seed_builtin_brand_assets()
          second = seed_builtin_brand_assets()
          if first[0]["action"] != "seeded":
              raise SystemExit(f"expected first seed to upload asset: {first}")
          if second[0]["action"] != "verified":
              raise SystemExit(f"expected second seed to verify existing asset: {second}")

          asset = BUILTIN_BRAND_ASSETS[0]
          store = ObjectStore()
          stored = store.get_bytes(asset.storage_key)
          digest = hashlib.sha256(stored).hexdigest()
          if digest != asset.sha256:
              raise SystemExit(
                  f"stored brand asset checksum mismatch: expected {asset.sha256}, got {digest}"
              )
          stat = store.stat(asset.storage_key)
          if stat["size_bytes"] != len(stored):
              raise SystemExit("stored brand asset size mismatch")
          print(
              f"verified {asset.storage_key} sha256={digest} size={stat['size_bytes']}"
          )
          PY

      - name: Validate Compose
        env:
          KATCHA_ENV_FILE: .env.example
        run: |
          docker compose --env-file .env.example config >/dev/null
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.intelligence.yml config >/dev/null
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.discovery.yml config >/dev/null
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.trends.yml config >/dev/null

  renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: renderer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install renderer dependencies
        run: npm install --ignore-scripts

      - name: Bundle Remotion composition
        run: |
          node --input-type=module -e "
          import path from 'node:path';
          import {bundle} from '@remotion/bundler';
          const serveUrl = await bundle({entryPoint: path.resolve('src/entry.jsx')});
          if (!serveUrl) process.exit(1);
          console.log(serveUrl);
          "

      - name: Ensure headless browser and FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          npx remotion browser ensure

      - name: Encode and verify both reaction overlays
        run: node test/reaction-smoke.mjs

      - name: Encode and verify channel editing blueprints
        run: node test/blueprint-smoke.mjs

      - name: Render and verify grounded thumbnail still
        run: node test/thumbnail-smoke.mjs

      - name: Upload branded reaction previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ranksnaxx-reaction-previews
          path: renderer/reaction-smoke-previews/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload synthetic blueprint previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-blueprint-previews
          path: renderer/blueprint-smoke-previews/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload synthetic thumbnail preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-thumbnail-preview
          path: renderer/thumbnail-smoke-previews/
          if-no-files-found: ignore
          retention-days: 7

  explorer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate explorer interactions and responsive layout
        run: npm test
      - name: Upload explorer screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explorer-screenshots
          path: web-tests/test-results/
          if-no-files-found: ignore
          retention-days: 7
