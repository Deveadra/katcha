name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint
        run: ruff check src tests

      - name: Compile
        run: python -m compileall -q src

      - name: Import smoke
        run: python -c "import katcha.api.main; import katcha.orchestration.publishing_worker"

      - name: Test
        run: pytest -q

      - name: Validate Compose
        env:
          KATCHA_ENV_FILE: .env.example
        run: docker compose --env-file .env.example config >/dev/null

  renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: renderer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install renderer dependencies
        run: npm install --ignore-scripts

      - name: Bundle Remotion composition
        run: |
          node --input-type=module -e "
          import path from 'node:path';
          import {bundle} from '@remotion/bundler';
          const serveUrl = await bundle({entryPoint: path.resolve('src/entry.jsx')});
          if (!serveUrl) process.exit(1);
          console.log(serveUrl);
          "
