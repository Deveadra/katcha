name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: katcha
          POSTGRES_PASSWORD: katcha
          POSTGRES_DB: katcha
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U katcha -d katcha"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint
        run: ruff check src tests

      - name: Compile
        run: python -m compileall -q src

      - name: Validate migration graph
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          heads = ScriptDirectory.from_config(Config("alembic.ini")).get_heads()
          if len(heads) != 1:
              raise SystemExit(f"expected exactly one Alembic head, found: {heads}")
          print(f"Alembic head: {heads[0]}")
          PY

      - name: Import smoke
        run: |
          python -c "import katcha.api.main; import katcha.api.trends; import katcha.orchestration.publishing_worker; import katcha.orchestration.longform_worker; import katcha.orchestration.intelligence_worker; import katcha.orchestration.discovery_worker; import katcha.orchestration.trend_worker"

      - name: Apply migrations to fresh PostgreSQL
        env:
          KATCHA_DATABASE_URL: postgresql+psycopg://katcha:katcha@127.0.0.1:5432/katcha
        run: alembic upgrade head

      - name: Test
        run: pytest -q

      - name: Verify built-in brand assets through S3-compatible HTTP endpoint
        env:
          KATCHA_S3_ENDPOINT_URL: http://127.0.0.1:19000
          KATCHA_S3_ACCESS_KEY: katcha
          KATCHA_S3_SECRET_KEY: katcha-local-secret
          KATCHA_S3_BUCKET: katcha-media
          KATCHA_S3_REGION: us-east-1
          KATCHA_S3_FORCE_PATH_STYLE: "true"
        run: |
          python -m pip install 'moto[server]>=5,<6'
          moto_server -H 127.0.0.1 -p 19000 >/tmp/katcha-moto.log 2>&1 &
          moto_pid=$!
          trap 'kill "$moto_pid" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:19000/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/katcha-moto.log
              exit 1
            fi
            sleep 1
          done
          python - <<'PY'
          import hashlib

          from katcha.integrations.storage import ObjectStore
          from katcha.services.brand_assets import BUILTIN_BRAND_ASSETS, seed_builtin_brand_assets

          first = seed_builtin_brand_assets()
          second = seed_builtin_brand_assets()
          if first[0]["action"] != "seeded":
              raise SystemExit(f"expected first seed to upload asset: {first}")
          if second[0]["action"] != "verified":
              raise SystemExit(f"expected second seed to verify existing asset: {second}")

          asset = BUILTIN_BRAND_ASSETS[0]
          store = ObjectStore()
          stored = store.get_bytes(asset.storage_key)
          digest = hashlib.sha256(stored).hexdigest()
          if digest != asset.sha256:
              raise SystemExit(
                  f"stored brand asset checksum mismatch: expected {asset.sha256}, got {digest}"
              )
          stat = store.stat(asset.storage_key)
          if stat["size_bytes"] != len(stored):
              raise SystemExit("stored brand asset size mismatch")
          print(
              f"verified {asset.storage_key} sha256={digest} size={stat['size_bytes']}"
          )
          PY

      - name: Validate Compose
        env:
          KATCHA_ENV_FILE: .env.example
        run: |
          docker compose --env-file .env.example config >/dev/null
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.intelligence.yml config >/dev/null
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.discovery.yml config >/dev/null
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.trends.yml config >/dev/null
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.acceptance.yml config >/dev/null

  temporal-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KATCHA_ENV_FILE: .env.example
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start PostgreSQL and Temporal
        run: |
          docker compose --env-file .env.example up -d postgres temporal

      - name: Verify Temporal becomes healthy
        run: |
          for attempt in $(seq 1 60); do
            status="$(docker inspect --format='{{.State.Health.Status}}' katcha-temporal-1 2>/dev/null || true)"
            if [ "$status" = "healthy" ]; then
              docker compose --env-file .env.example ps postgres temporal
              exit 0
            fi
            if ! docker ps -a --format '{{.Names}} {{.Status}}' | grep -q '^katcha-temporal-1 '; then
              echo "Temporal container was not created"
              docker logs katcha-temporal-1
              exit 1
            fi
            if docker ps -a --format '{{.Names}} {{.Status}}' | grep '^katcha-temporal-1 ' | grep -q 'Exited'; then
              echo "Temporal exited before becoming healthy"
              docker logs katcha-temporal-1
              exit 1
            fi
            sleep 2
          done
          docker compose --env-file .env.example ps postgres temporal
          docker logs katcha-temporal-1
          exit 1

      - name: Tear down Temporal smoke stack
        if: always()
        run: docker compose --env-file .env.example down -v

  storage-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build pinned local MinIO image
        run: docker build -f Dockerfile.minio -t katcha-minio-ci .

      - name: Verify MinIO starts and becomes healthy
        run: |
          docker run -d \
            --name katcha-minio-ci \
            -p 19000:9000 \
            -e MINIO_ROOT_USER=katcha \
            -e MINIO_ROOT_PASSWORD=katcha-local-secret \
            katcha-minio-ci
          trap 'docker rm -f katcha-minio-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:19000/minio/health/live >/dev/null; then
              docker run --rm katcha-minio-ci --version
              exit 0
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs katcha-minio-ci
              exit 1
            fi
            sleep 2
          done

  renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: renderer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install renderer dependencies
        run: npm install --ignore-scripts

      - name: Bundle Remotion composition
        run: |
          node --input-type=module -e "
          import path from 'node:path';
          import {bundle} from '@remotion/bundler';
          const serveUrl = await bundle({entryPoint: path.resolve('src/entry.jsx')});
          if (!serveUrl) process.exit(1);
          console.log(serveUrl);
          "

      - name: Ensure headless browser and FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          npx remotion browser ensure

      - name: Encode and verify both reaction overlays
        run: node test/reaction-smoke.mjs

      - name: Encode and verify channel editing blueprints
        run: node test/blueprint-smoke.mjs

      - name: Render and verify grounded thumbnail still
        run: node test/thumbnail-smoke.mjs

      - name: Upload branded reaction previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ranksnaxx-reaction-previews
          path: renderer/reaction-smoke-previews/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload synthetic blueprint previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-blueprint-previews
          path: renderer/blueprint-smoke-previews/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload synthetic thumbnail preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-thumbnail-preview
          path: renderer/thumbnail-smoke-previews/
          if-no-files-found: ignore
          retention-days: 7

  explorer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate explorer interactions and responsive layout
        run: npm test
      - name: Upload explorer screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explorer-screenshots
          path: web-tests/test-results/
          if-no-files-found: ignore
          retention-days: 7
