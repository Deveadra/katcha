[Service]
LoadCredential=cf-access-id:%h/.config/katcha-acquisition/credentials/cf-access-id
LoadCredential=cf-access-secret:%h/.config/katcha-acquisition/credentials/cf-access-secret
Environment=KATCHA_ACQUISITION_CF_ACCESS_ID_FILE=%d/cf-access-id
Environment=KATCHA_ACQUISITION_CF_ACCESS_SECRET_FILE=%d/cf-access-secret
