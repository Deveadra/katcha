name: katcha-production

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-control-env: &control-env
  - ${KATCHA_ENV_FILE:-/etc/katcha/katcha.env}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${KATCHA_POSTGRES_USER:-katcha}
      POSTGRES_PASSWORD: ${KATCHA_POSTGRES_PASSWORD:?Set KATCHA_POSTGRES_PASSWORD}
      POSTGRES_DB: ${KATCHA_POSTGRES_DB:-katcha}
    volumes:
      - /srv/katcha/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KATCHA_POSTGRES_USER:-katcha} -d ${KATCHA_POSTGRES_DB:-katcha}"]
      interval: 30s
      start_interval: 1s
      start_period: 20s
      timeout: 3s
      retries: 30
    mem_limit: 2g
    cpus: 0.75
    logging: *default-logging
    networks: [backend]

  temporal:
    image: temporalio/auto-setup:1.27.2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${KATCHA_POSTGRES_USER:-katcha}
      POSTGRES_PWD: ${KATCHA_POSTGRES_PASSWORD:?Set KATCHA_POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgres
      SQL_MAX_CONNS: "${KATCHA_TEMPORAL_SQL_MAX_CONNS:-5}"
      SQL_MAX_IDLE_CONNS: "${KATCHA_TEMPORAL_SQL_MAX_IDLE_CONNS:-2}"
      SQL_VIS_MAX_CONNS: "${KATCHA_TEMPORAL_SQL_VIS_MAX_CONNS:-2}"
      SQL_VIS_MAX_IDLE_CONNS: "${KATCHA_TEMPORAL_SQL_VIS_MAX_IDLE_CONNS:-1}"
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    volumes:
      - ../dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z $(hostname -i | awk '{print $1}') 7233"]
      interval: 30s
      start_interval: 1s
      start_period: 30s
      timeout: 3s
      retries: 60
    mem_limit: 1536m
    cpus: 0.5
    logging: *default-logging
    networks: [backend]

  migrate:
    image: ${KATCHA_IMAGE_REGISTRY:-ghcr.io/deveadra}/katcha-control:${KATCHA_RELEASE_SHA:?Set KATCHA_RELEASE_SHA to the exact deployed git SHA}
    pull_policy: always
    env_file: *control-env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    networks: [backend]

  api:
    image: ${KATCHA_IMAGE_REGISTRY:-ghcr.io/deveadra}/katcha-control:${KATCHA_RELEASE_SHA:?Set KATCHA_RELEASE_SHA to the exact deployed git SHA}
    pull_policy: always
    restart: unless-stopped
    env_file: *control-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    environment:
      KATCHA_INTELLIGENCE_HANDOFF_DIR: /handoff
    volumes:
      - /srv/katcha/handoff:/handoff
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health/ready', timeout=3).read()",
        ]
      interval: 30s
      start_interval: 2s
      start_period: 30s
      timeout: 5s
      retries: 20
    command: ["uvicorn", "katcha.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    mem_limit: 768m
    cpus: 0.5
    logging: *default-logging
    networks: [backend]

  cloudflared:
    image: cloudflare/cloudflared:2026.9.2
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    command:
      [
        "tunnel",
        "--no-autoupdate",
        "run",
        "--token",
        "${KATCHA_CLOUDFLARE_TUNNEL_TOKEN:?Set KATCHA_CLOUDFLARE_TUNNEL_TOKEN}",
      ]
    mem_limit: 192m
    cpus: 0.2
    logging: *default-logging
    networks: [backend]

  worker:
    image: ${KATCHA_IMAGE_REGISTRY:-ghcr.io/deveadra}/katcha-ingest:${KATCHA_RELEASE_SHA:?Set KATCHA_RELEASE_SHA to the exact deployed git SHA}
    pull_policy: always
    restart: unless-stopped
    env_file: *control-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    command: ["python", "-m", "katcha.orchestration.worker"]
    mem_limit: 768m
    cpus: 0.5
    logging: *default-logging
    networks: [backend]

  intelligence-worker:
    image: ${KATCHA_IMAGE_REGISTRY:-ghcr.io/deveadra}/katcha-control:${KATCHA_RELEASE_SHA:?Set KATCHA_RELEASE_SHA to the exact deployed git SHA}
    pull_policy: always
    restart: unless-stopped
    env_file: *control-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    command: ["python", "-m", "katcha.orchestration.intelligence_worker"]
    mem_limit: 1g
    cpus: 0.6
    logging: *default-logging
    networks: [backend]

  analysis-worker:
    image: ${KATCHA_IMAGE_REGISTRY:-ghcr.io/deveadra}/katcha-analysis:${KATCHA_RELEASE_SHA:?Set KATCHA_RELEASE_SHA to the exact deployed git SHA}
    pull_policy: always
    restart: unless-stopped
    profiles: ["local-heavy-analysis"]
    env_file: *control-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    command: ["python", "-m", "katcha.orchestration.analysis_worker"]
    volumes:
      - analysis-model-cache:/home/katcha/.cache
    mem_limit: 3g
    cpus: 1.0
    logging: *default-logging
    networks: [backend]

  renderer:
    image: ${KATCHA_IMAGE_REGISTRY:-ghcr.io/deveadra}/katcha-renderer:${KATCHA_RELEASE_SHA:?Set KATCHA_RELEASE_SHA to the exact deployed git SHA}
    pull_policy: always
    restart: unless-stopped
    env_file: *control-env
    environment:
      HOME: /home/katcha
      AWS_PROFILE: ${KATCHA_AWS_PROFILE:-katcha-automation}
      REMOTION_AWS_PROFILE: ${KATCHA_AWS_PROFILE:-katcha-automation}
      AWS_SDK_LOAD_CONFIG: "1"
      AWS_REGION: ${KATCHA_REMOTION_LAMBDA_REGION:-us-east-1}
      AWS_DEFAULT_REGION: ${KATCHA_REMOTION_LAMBDA_REGION:-us-east-1}
    volumes:
      # Hosted AWS auth is normalized under /etc/katcha/aws. The profile may
      # use Roles Anywhere credential_process with cert/key/helper files kept
      # in this directory and referenced by their container paths.
      - /etc/katcha/aws:/home/katcha/.aws:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      start_interval: 2s
      start_period: 60s
      timeout: 5s
      retries: 20
    mem_limit: 1g
    cpus: 0.5
    logging: *default-logging
    networks: [backend]

  production-worker:
    image: ${KATCHA_IMAGE_REGISTRY:-ghcr.io/deveadra}/katcha-production:${KATCHA_RELEASE_SHA:?Set KATCHA_RELEASE_SHA to the exact deployed git SHA}
    pull_policy: always
    restart: unless-stopped
    env_file: *control-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      renderer:
        condition: service_healthy
    command: ["python", "-m", "katcha.orchestration.production_worker"]
    mem_limit: 1g
    cpus: 0.6
    logging: *default-logging
    networks: [backend]

  backup-writer:
    image: ${KATCHA_IMAGE_REGISTRY:-ghcr.io/deveadra}/katcha-control:${KATCHA_RELEASE_SHA:?Set KATCHA_RELEASE_SHA to the exact deployed git SHA}
    pull_policy: always
    profiles: ["ops"]
    user: "0:0"
    env_file:
      - ${KATCHA_BACKUP_ENV_FILE:-/etc/katcha/backup.env}
    environment:
      KATCHA_ENV: production
      KATCHA_RELEASE_SHA: ${KATCHA_RELEASE_SHA:?Set KATCHA_RELEASE_SHA}
      KATCHA_LEADERSHIP_FENCE_MODE: ${KATCHA_LEADERSHIP_FENCE_MODE:?Set KATCHA_LEADERSHIP_FENCE_MODE}
      KATCHA_LEADERSHIP_FENCE_URL: ${KATCHA_LEADERSHIP_FENCE_URL:?Set KATCHA_LEADERSHIP_FENCE_URL}
      KATCHA_LEADERSHIP_FENCE_TOKEN: ${KATCHA_LEADERSHIP_FENCE_TOKEN:?Set KATCHA_LEADERSHIP_FENCE_TOKEN}
      KATCHA_LEADERSHIP_FENCE_TIMEOUT_SECONDS: ${KATCHA_LEADERSHIP_FENCE_TIMEOUT_SECONDS:-5}
      KATCHA_DEPLOYMENT_ID: ${KATCHA_DEPLOYMENT_ID:?Set KATCHA_DEPLOYMENT_ID}
      KATCHA_DEPLOYMENT_EPOCH: ${KATCHA_DEPLOYMENT_EPOCH:?Set KATCHA_DEPLOYMENT_EPOCH}
    volumes:
      - /srv/katcha/backups-local:/backup
    command: ["python", "-m", "katcha.ops.disaster_backup", "--help"]
    mem_limit: 256m
    cpus: 0.2
    logging: *default-logging
    networks: [backend]

  backup-reader:
    image: ${KATCHA_IMAGE_REGISTRY:-ghcr.io/deveadra}/katcha-control:${KATCHA_RELEASE_SHA:?Set KATCHA_RELEASE_SHA to the exact deployed git SHA}
    pull_policy: always
    profiles: ["ops"]
    user: "0:0"
    env_file:
      - ${KATCHA_RESTORE_ENV_FILE:-/etc/katcha/restore.env}
    volumes:
      - /srv/katcha/backups-local:/backup
    command: ["python", "-m", "katcha.ops.disaster_backup", "--help"]
    mem_limit: 256m
    cpus: 0.2
    logging: *default-logging
    networks: [backend]

  telegram-worker:
    image: ${KATCHA_IMAGE_REGISTRY:-ghcr.io/deveadra}/katcha-control:${KATCHA_RELEASE_SHA:?Set KATCHA_RELEASE_SHA to the exact deployed git SHA}
    pull_policy: always
    restart: unless-stopped
    env_file: *control-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    command: ["python", "-m", "katcha.telegram_worker"]
    mem_limit: 256m
    cpus: 0.2
    logging: *default-logging
    networks: [backend]

volumes:
  analysis-model-cache:

networks:
  backend:
    driver: bridge
    internal: false
