services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: katcha
      POSTGRES_PASSWORD: katcha
      POSTGRES_DB: katcha
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U katcha -d katcha"]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.27.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: katcha
      POSTGRES_PWD: katcha
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.34.0
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: katcha
      MINIO_ROOT_PASSWORD: katcha-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 katcha katcha-local-secret &&
      mc mb --ignore-existing local/katcha-media;
      "

  migrate:
    build: .
    env_file: ${KATCHA_ENV_FILE:-.env}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  api:
    build: .
    env_file: ${KATCHA_ENV_FILE:-.env}
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    command: ["uvicorn", "katcha.api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build: .
    env_file: ${KATCHA_ENV_FILE:-.env}
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    command: ["python", "-m", "katcha.orchestration.worker"]

  analysis-worker:
    build:
      context: .
      dockerfile: Dockerfile.analysis
    env_file: ${KATCHA_ENV_FILE:-.env}
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    volumes:
      - model-cache:/home/katcha/.cache
    command: ["python", "-m", "katcha.orchestration.analysis_worker"]

  renderer:
    build:
      context: .
      dockerfile: Dockerfile.renderer
    env_file: ${KATCHA_ENV_FILE:-.env}
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8787:8787"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  production-worker:
    build:
      context: .
      dockerfile: Dockerfile.production
    env_file: ${KATCHA_ENV_FILE:-.env}
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      renderer:
        condition: service_healthy
    command: ["python", "-m", "katcha.orchestration.production_worker"]

  publishing-worker:
    build:
      context: .
      dockerfile: Dockerfile.publishing
    env_file: ${KATCHA_ENV_FILE:-.env}
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    command: ["python", "-m", "katcha.orchestration.publishing_worker"]

volumes:
  postgres-data:
  minio-data:
  model-cache:
