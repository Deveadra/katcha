services:
  acceptance-media:
    build: .
    command: >
      /bin/sh -ec '
      mkdir -p /tmp/katcha/acceptance-media;
      ffmpeg -hide_banner -loglevel error -y
        -f lavfi -i "testsrc2=size=720x1280:rate=30:duration=5"
        -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=5"
        -vf "hue=h=0" -shortest -c:v libx264 -preset ultrafast -crf 28
        -pix_fmt yuv420p -c:a aac -b:a 96k -movflags +faststart
        /tmp/katcha/acceptance-media/clip-1.mp4;
      ffmpeg -hide_banner -loglevel error -y
        -f lavfi -i "testsrc2=size=720x1280:rate=30:duration=5"
        -f lavfi -i "sine=frequency=554:sample_rate=48000:duration=5"
        -vf "hue=h=45" -shortest -c:v libx264 -preset ultrafast -crf 28
        -pix_fmt yuv420p -c:a aac -b:a 96k -movflags +faststart
        /tmp/katcha/acceptance-media/clip-2.mp4;
      ffmpeg -hide_banner -loglevel error -y
        -f lavfi -i "testsrc2=size=720x1280:rate=30:duration=5"
        -f lavfi -i "sine=frequency=659:sample_rate=48000:duration=5"
        -vf "hue=h=90" -shortest -c:v libx264 -preset ultrafast -crf 28
        -pix_fmt yuv420p -c:a aac -b:a 96k -movflags +faststart
        /tmp/katcha/acceptance-media/clip-3.mp4;
      ffmpeg -hide_banner -loglevel error -y
        -f lavfi -i "testsrc2=size=720x1280:rate=30:duration=5"
        -f lavfi -i "sine=frequency=784:sample_rate=48000:duration=5"
        -vf "hue=h=135" -shortest -c:v libx264 -preset ultrafast -crf 28
        -pix_fmt yuv420p -c:a aac -b:a 96k -movflags +faststart
        /tmp/katcha/acceptance-media/clip-4.mp4;
      ffmpeg -hide_banner -loglevel error -y
        -f lavfi -i "testsrc2=size=720x1280:rate=30:duration=5"
        -f lavfi -i "sine=frequency=880:sample_rate=48000:duration=5"
        -vf "hue=h=180" -shortest -c:v libx264 -preset ultrafast -crf 28
        -pix_fmt yuv420p -c:a aac -b:a 96k -movflags +faststart
        /tmp/katcha/acceptance-media/clip-5.mp4;
      cd /tmp/katcha/acceptance-media;
      exec python -m http.server 8090 --bind 0.0.0.0
      '
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/clip-1.mp4"]
      interval: 5s
      timeout: 3s
      start_period: 10s
