services:
  renderer:
    environment:
      AWS_PROFILE: ${AWS_PROFILE:?Set AWS_PROFILE to the dedicated Katcha/Remotion AWS profile}
      AWS_SDK_LOAD_CONFIG: "1"
      AWS_REGION: ${KATCHA_REMOTION_LAMBDA_REGION:-us-east-1}
      AWS_DEFAULT_REGION: ${KATCHA_REMOTION_LAMBDA_REGION:-us-east-1}
    volumes:
      - ${HOME:?HOME is required}/.aws:/home/katcha/.aws:ro
